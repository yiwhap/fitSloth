[project]
name = "fitsloth"
version = "0.1.0"
description = "Image-to-image food search using CLIP embeddings"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==1.26.4",
    "opencv-python==4.11.0.86",
    "Pillow==10.3.0",
    "torch==2.8.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torchvision==0.23.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torchvision==0.17.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "transformers==4.44.2",
    "ultralytics==8.4.146",
]

[tool.uv]
package = false
